.00" y="310.00" class="label small" text-anchor="start" >O</text><text x="24.00" y="345.00" class="small" text-anchor="start" >frame0</text><text x="35.00" y="257.00" class="label" text-anchor="start" >p₁</text><text x="116.00" y="193.00" class="label" text-anchor="start" >p₂</text><text x="266.00" y="239.00" class="label" text-anchor="start" >p₃</text><line x1="295.50" y1="213.75" x2="295.50" y2="162.75" class="offset" /><line x1="295.50" y1="213.75" x2="295.50" y2="125.35" class="axis" marker-end="url(#axis)" stroke-dasharray="4 4"/><text x="258.00" y="111.00" class="axislabel label" text-anchor="start" >⁰z₃</text><line x1="300.50" y1="213.75" x2="325.50" y2="213.75" class="guide" /><line x1="316.50" y1="216.75" x2="324.50" y2="210.75" class="offset" stroke-width="1.5"/><line x1="300.50" y1="162.75" x2="325.50" y2="162.75" class="guide" /><line x1="316.50" y1="165.75" x2="324.50" y2="159.75" class="offset" stroke-width="1.5"/><line x1="320.50" y1="213.75" x2="320.50" y2="162.75" class="offset" stroke-width="1.5"/><text x="330.50" y="194.25" class="offsetlabel label" text-anchor="start" >h</text><text x="180.00" y="294.00" class="offsetlabel" text-anchor="start" >h lies along the third joint axis.</text><text x="180.00" y="320.00" class="small" text-anchor="start" >All other joint and tool offsets are identical.</text><text x="180.00" y="346.00" class="small" text-anchor="start" >Shown at q = (0, 0, 0), in frame0.</text></g>
