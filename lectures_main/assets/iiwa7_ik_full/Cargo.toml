[package]
name = "iiwa7-ik"
version = "0.1.0"
edition = "2024"
description = "Fixed-q3 KUKA iiwa 7 analytical IK using Paden-Kahan subproblems"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
